name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        nim:
          - '2.2.0'
          - stable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ matrix.nim }}

      - name: Show toolchain
        run: |
          nim -v
          nimble -v
          clang --version

      - name: Verify
        run: nimble verify -y

  arc-valgrind:
    name: ARC Valgrind
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.0'
      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Run repeated ARC paths
        run: |
          nim c --mm:arc -d:release --nimcache:nimcache/arc-memory -o:nimcache/test_arc_memory tests/test_arc_memory.nim
          valgrind --leak-check=full --errors-for-leak-kinds=all --error-exitcode=1 nimcache/test_arc_memory
